tasks:
  - name: embed_sentences
    kind: slurm
    module: ./embed_sentences.py
    input_ext: .csv
    output_ext: .npy
    keep_output: true
    max_workers: 4
    worker_resources:
      cpus: 4
      gpus: 1
      memory: "16G"
      time: "01:00:00"
    params:
      model_name: paraphrase-multilingual-mpnet-base-v2
    setup_commands: |
      module purge
      module load anaconda3/2024.6
      conda activate remarx
